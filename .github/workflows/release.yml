name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: win-x64
            args: --win --x64
          - os: windows-latest
            id: win-arm64
            args: --win --arm64
          - os: ubuntu-latest
            id: linux-x64
            args: --linux --x64
          - os: ubuntu-latest
            id: linux-arm64
            args: --linux --arm64
          - os: macos-latest
            id: mac-x64
            args: --mac --x64
          - os: macos-latest
            id: mac-arm64
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: portable zip
        run: node scripts/pack-portable.mjs --all
      - uses: actions/upload-artifact@v4
        with:
          name: bonfire-${{ matrix.id }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum Bonfire-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
